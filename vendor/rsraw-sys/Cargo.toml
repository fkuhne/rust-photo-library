# A copy of rsraw-sys 0.1.1 (MIT, https://github.com/hexilee/rsraw), building LibRaw 0.22.3
# from the submodule in LibRaw/ instead of the 0.21.3 it bundles (Photomatch's record 0013).
# In photo-library, rsraw and photo-library reach it by path (the library's record 0005).
[package]
name = "rsraw-sys"
version = "0.1.1"
build = "build.rs"
edition = "2021"
authors = ["hexilee <i@hexilee.me>"]
description = "Low-level FFI bindings for the LibRaw C++ library"
license = "MIT"
repository = "https://github.com/hexilee/rsraw"

[dependencies]
libc = "0.2"

[features]
default = []

[lib]
name = "rsraw_sys"

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
bindgen = { version = "0.71", default-features = false, features = ["runtime"] }
