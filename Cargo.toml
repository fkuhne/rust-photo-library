# photo-library, the crate the owner's photo apps share (records 0002 and 0005). Its vendored
# rsraw and rsraw-sys are members of this workspace and reached by path: a [patch] here would be
# ignored in the apps that depend on the library, which would then build the published
# rsraw-sys, with LibRaw 0.21.3.
[package]
name = "photo-library"
version = "0.1.0"
edition = "2024"
description = "Reading RAW and image files, thumbnails and ratings in XMP sidecars, shared by the owner's photo apps."
repository = "https://github.com/fkuhne/rust-photo-library"
# Private for now (record 0003): never published by mistake.
publish = false

# The versions PhotoMatch builds with, as default requirements: a library's Cargo.lock doesn't
# reach the apps, each app's own lockfile pins what it builds, and an exact `=` here could make
# an app's dependencies unresolvable (record 0006).
[dependencies]
rsraw = { path = "vendor/rsraw" }
rsraw-sys = { path = "vendor/rsraw-sys" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
kamadak-exif = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
blake3 = "1.8.7"
walkdir = "2.5.0"
xmp_toolkit = "1.12.1"

# For the feature `places`: reading the place list built in. The version `png` and `tiff` bring
# already (record 0010).
flate2 = { version = "1.1.10", optional = true }

[features]
# A position named by its town, region and country, offline, from GeoNames' towns (record 0010):
# about 2.7 MB of data, which an app that doesn't name places leaves out.
places = ["dep:flate2"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[[example]]
name = "place_of"
required-features = ["places"]

[workspace]
members = ["vendor/rsraw", "vendor/rsraw-sys"]
